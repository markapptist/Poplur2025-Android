# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx4g
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Disable VFS watcher — macOS com.apple.provenance xattr confuses Gradle 9's
# file watcher causing "Failed to normalize content of android.jar" errors.
org.gradle.vfs.watch=false

# AndroidX libraries are used in this project
android.useAndroidX=true

# Optimization flags
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Signing Configuration
RELEASE_STORE_FILE=../keystore/release.jks
RELEASE_STORE_PASSWORD=poplur2025
RELEASE_KEY_ALIAS=poplur-release
RELEASE_KEY_PASSWORD=poplur2025
